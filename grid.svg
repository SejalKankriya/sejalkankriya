<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60" role="img" aria-label="">
  <style>
    .d { fill: #6b7280; }
    @media (prefers-color-scheme: light) {
      .d { fill: #9ca3af; }
    }
    @keyframes drift1 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-2px); } }
    @keyframes drift2 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(2px); } }
    @keyframes drift3 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-1.5px); } }
    @keyframes drift4 { 0%,100% { transform: translateY(0); } 50% { transform: translateY(1.5px); } }
    @keyframes pulse  { 0%,100% { opacity: 0.4; } 50% { opacity: 1; } }

    .a { animation: drift1 5s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .b { animation: drift2 7s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .c { animation: drift3 6s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .e { animation: drift4 8s ease-in-out infinite; transform-origin: center; transform-box: fill-box; }
    .p { animation: pulse 4s ease-in-out infinite; }
    .p2 { animation: pulse 6s ease-in-out infinite; }
    .p3 { animation: pulse 5s ease-in-out infinite; }
  </style>
